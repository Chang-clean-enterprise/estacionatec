services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: estacionatec-dynamodb
    # In-memory: data resets on restart. Run `npm run db:init` to recreate and seed.
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: estacionatec-dynamodb-admin
    depends_on:
      - dynamodb-local
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8001:8001"
